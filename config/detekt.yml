config:
  validation: false
  warningsAsErrors: false

# Minimal config for parity port: allow snake_case, disable noisy rules
naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9_]*'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z][a-zA-Z0-9_]*(\.[a-z][a-zA-Z0-9_]*)*'

# All other rule sets disabled for parity (snake_case, long methods, etc. are intentional)
complexity:
  active: false
style:
  active: false
comments:
  active: false
coroutines:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
performance:
  active: false
potentialBugs:
  active: false
